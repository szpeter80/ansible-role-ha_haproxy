---
# tasks file for ha_haproxy

- name: Assert target os_family is supported
  ansible.builtin.assert:
    that: ansible_os_family in ha_haproxy_supported_os_families
    fail_msg: >-
      Unsupported os_family '{{ ansible_os_family }}'
      ({{ ansible_distribution }} {{ ansible_distribution_version }}).
      Supported: {{ ha_haproxy_supported_os_families | join(', ') }}.
      Extend ha_haproxy_supported_os_families and
      ha_haproxy_packages_by_os_family to add support.
    quiet: true
  tags:
    - always

- name: Install required packages
  ansible.builtin.include_tasks: "pkg-install-{{ ansible_os_family }}.yml"

- name: Configure firewall
  ansible.builtin.include_tasks: "firewall-{{ ansible_os_family }}.yml"

# Keepalived setup

- name: Deploy keepalived config
  become: true
  ansible.builtin.template:
    src: templates/keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart keepalived
  tags: keepalived_reconfig

- name: Enable and start keepalived
  become: true
  ansible.builtin.systemd:
    name: keepalived
    state: started
    enabled: true

# Haproxy setup

- name: Set sysctl to bind non-local address
  become: true
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: '1'
    reload: true
    sysctl_file: /etc/sysctl.d/98-haproxy.conf
    state: present
    sysctl_set: true

- name: Setsebool permanent any connect
  become: true
  ansible.posix.seboolean:
    name: haproxy_connect_any
    state: true
    persistent: true
  when: ha_haproxy_selinux_enabled | bool

- name: Create conf.d for haproxy
  become: true
  ansible.builtin.file:
    path: "/etc/haproxy/conf.d"
    owner: root
    group: root
    mode: "0755"
    state: directory

- name: Deploy config for haproxy
  become: true
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "/etc/haproxy/haproxy.cfg"
    owner: root
    group: root
    mode: "0644"
  notify: Restart haproxy
  tags: haproxy_reconfig

# Only the files listed in ha_haproxy_confd are written. Anything else in
# /etc/haproxy/conf.d is left alone: content is expected to land there outside
# Ansible and is loaded by the includedir above.
- name: Deploy haproxy proxy fragments to conf.d
  become: true
  ansible.builtin.template:
    src: "conf.d/{{ item | regex_replace('\\.cfg$', '.j2') }}"
    dest: "/etc/haproxy/conf.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ha_haproxy_confd }}"
  notify: Restart haproxy
  tags: haproxy_reconfig

- name: Install haproxy stat helper
  become: true
  ansible.builtin.copy:
    src: haproxy_stat.sh
    dest: /root/haproxy_stat.sh
    owner: root
    group: root
    mode: "0755"

- name: Configure rsyslog for haproxy log
  become: true
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/98-haproxy.conf
    content: |
      $AddUnixListenSocket /var/lib/haproxy/rsyslog-socket
      {{ ha_haproxy_syslog_facility }}.* action(type="omfile" file="{{ ha_haproxy_logfile }}")
  notify: Restart rsyslog

- name: Create SELinux type enforcement file
  become: true
  ansible.builtin.copy:
    dest: /root/rsyslog-haproxy.te
    content: |
      module rsyslog-haproxy 2.0;

      require {
              type syslogd_t;
              type haproxy_var_lib_t;
              class dir { add_name remove_name write search };
              class sock_file { create setattr unlink };
      }

      allow syslogd_t haproxy_var_lib_t:dir { add_name remove_name write search };
      allow syslogd_t haproxy_var_lib_t:sock_file { create setattr unlink };
    mode: '0600'
  register: rsyslogd_selinux_policy
  when: ha_haproxy_selinux_enabled | bool
  notify:
    - Restart rsyslog
    - Restart haproxy

- name: Compile SELinux module
  become: true
  ansible.builtin.command: checkmodule -M -m -o /root/rsyslog-haproxy.mod /root/rsyslog-haproxy.te
  when:
    - ha_haproxy_selinux_enabled | bool
    - rsyslogd_selinux_policy.changed | default(false)
  changed_when: true

- name: Package SELinux module
  become: true
  ansible.builtin.command: semodule_package -o /root/rsyslog-haproxy.pp -m /root/rsyslog-haproxy.mod
  when:
    - ha_haproxy_selinux_enabled | bool
    - rsyslogd_selinux_policy.changed | default(false)
  changed_when: true

- name: Load SELinux module
  become: true
  ansible.builtin.command: semodule -i /root/rsyslog-haproxy.pp
  when:
    - ha_haproxy_selinux_enabled | bool
    - rsyslogd_selinux_policy.changed | default(false)
  changed_when: true

- name: Enable and start haproxy
  become: true
  ansible.builtin.systemd:
    name: haproxy
    state: started
    enabled: true
